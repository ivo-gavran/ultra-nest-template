name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Keep database suites and the shared subprocess build sequential.
      - name: Verify Docker availability
        run: docker info
      # Coverage runs unit + integration once, including official store races.
      - run: pnpm test:cov
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level=high
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm build
      - run: pnpm verify:build
      - name: Build and verify Docker Compose
        run: bash scripts/verify-compose.sh
      - name: Verify an initialized template copy
        run: pnpm verify:template
